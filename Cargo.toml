[package]
name = "catalogo-proveedores"
version = "0.1.0"
edition = "2024"
description = "Checklist de proveedores con catalogo JSON editable"
license = "MIT"

[dependencies]
eframe = { version = "=0.34.3", default-features = false, features = ["default_fonts", "glow"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = 2
lto = "thin"
strip = true
