[package]
name = "catalogo-proveedores"
version = "0.1.0"
edition = "2024"
description = "Checklist de proveedores con catalogo JSON editable"
license = "MIT"

[dependencies]
eframe = { version = "=0.37.0", default-features = false, features = ["default_fonts", "glow"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
image = { version = "=0.25.10", default-features = false, features = ["png"] }

[profile.release]
opt-level = 2
lto = "thin"
strip = true
