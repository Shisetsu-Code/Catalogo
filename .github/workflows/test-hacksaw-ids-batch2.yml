name: Probe recent Hacksaw game ID candidates (batch 2)
on:
  push:
    branches: [hacksaw-catalog-export-20261028]
    paths:
      - tools/test_hacksaw_ids_batch2.py
      - .github/workflows/test-hacksaw-ids-batch2.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - run: python tools/test_hacksaw_ids_batch2.py
      - name: Save evidence
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/hacksaw/id_tests_batch2.json || true
          git diff --cached --quiet || git commit -m "Record second bounded demo ID batch"
          git pull --rebase origin hacksaw-catalog-export-20261028
          git push origin HEAD:hacksaw-catalog-export-20261028
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hacksaw-id-batch2
          path: data/hacksaw/id_tests_batch2.json
          if-no-files-found: warn
