name: Check Hacksaw demo game IDs
on:
  push:
    branches: [hacksaw-catalog-export-20261028]
    paths:
      - tools/test_hacksaw_ids.py
      - .github/workflows/test-hacksaw-ids.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test-ids:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Test known game IDs and negative controls
        run: python tools/test_hacksaw_ids.py
      - name: Save evidence in branch
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/hacksaw/id_tests.json || true
          git diff --cached --quiet || git commit -m "Record bounded Hacksaw launcher ID test results"
          git push || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hacksaw-id-tests
          path: data/hacksaw/id_tests.json
          if-no-files-found: warn
