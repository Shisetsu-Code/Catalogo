name: Probe official Hacksaw demo links
on:
  push:
    branches: [hacksaw-catalog-export-20261028]
    paths: ['tools/probe_hacksaw_direct.py', '.github/workflows/probe-hacksaw-direct.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install public browser dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Probe real demo launch URLs
        run: python tools/probe_hacksaw_direct.py
      - name: Save probe evidence on experiment branch
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/hacksaw/direct_demo_probes.json || true
          git diff --cached --quiet || git commit -m "Record official demo URL probes"
          git push || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hacksaw-direct-demo-probes
          path: data/hacksaw/direct_demo_probes.json
          if-no-files-found: warn
