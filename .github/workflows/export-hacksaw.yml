name: Exportar catalogo Hacksaw
on:
  push:
    branches:
      - hacksaw-catalog-export-20261028
    paths:
      - .github/workflows/export-hacksaw.yml
      - tools/scrape_hacksaw.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install Playwright and Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Extract public game links
        run: python tools/scrape_hacksaw.py
      - name: Store result on export branch
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/hacksaw/catalogo.csv data/hacksaw/catalogo.json
          git diff --cached --quiet || git commit -m "Export Hacksaw demo catalog"
          git push || true
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hacksaw-catalogo
          path: data/hacksaw/
          if-no-files-found: warn
